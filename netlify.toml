[build]
  command = "npm run build"
  publish = "dist/paso-firme-web/browser"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "ng serve"
  targetPort = 4200
  port = 8888

# SPA: send every route to index.html so Angular's router handles it
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El panel no debe indexarse ni guardarse en caché
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
